<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a564f"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1240" height="760" fill="#f4f5f6"/>

  <!-- title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1f2a26">Serve level fix: Run 0 to Run 1</text>
  <text x="40" y="80" font-size="15" fill="#5b6661">The prediction formula does not change. Only what mu means changes: from the 1992 to 2024 average to the 2024 level.</text>

  <!-- ===== Panel: Run 0 ===== -->
  <rect x="40" y="110" width="560" height="270" rx="18" fill="#fff" stroke="#e1e5e3" filter="url(#sh)"/>
  <text x="64" y="144" font-size="17" font-weight="700" fill="#1f2a26">Run 0 · trained and saved</text>
  <text x="64" y="166" font-size="13" fill="#5b6661">mu learned once from every row 1992 to 2024</text>

  <rect x="64" y="190" width="120" height="64" rx="12" fill="#68786f"/>
  <text x="124" y="216" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">mu</text>
  <text x="124" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">33-year average</text>

  <rect x="196" y="190" width="120" height="64" rx="12" fill="#1c5d4a"/>
  <text x="256" y="216" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">+ a·x_i</text>
  <text x="256" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">server brings</text>

  <rect x="328" y="190" width="120" height="64" rx="12" fill="#2a6490"/>
  <text x="388" y="216" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">− b·x_j</text>
  <text x="388" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">returner takes</text>

  <rect x="460" y="190" width="120" height="64" rx="12" fill="#b0512a"/>
  <text x="520" y="216" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">+ x_iᵀ W x_j</text>
  <text x="520" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">pairing</text>

  <line x1="320" y1="282" x2="320" y2="300" stroke="#4a564f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="220" y="304" width="200" height="48" rx="12" fill="#3f7a3c"/>
  <text x="320" y="333" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">z → p = 1/(1+e^−z)</text>
  <line x1="64" y1="270" x2="580" y2="270" stroke="#e1e5e3" stroke-width="1"/>
  <text x="64" y="370" font-size="12" fill="#8a3a2a" font-weight="600">Result on 2025: 1 to 1.5 pp too low on every surface</text>

  <!-- ===== Panel: Run 1 training ===== -->
  <rect x="640" y="110" width="560" height="270" rx="18" fill="#fff" stroke="#e1e5e3" filter="url(#sh)"/>
  <text x="664" y="144" font-size="17" font-weight="700" fill="#1f2a26">Run 1 · while training</text>
  <text x="664" y="166" font-size="13" fill="#5b6661">one extra term per season, pinned to 0 for 2024</text>

  <rect x="664" y="190" width="96" height="64" rx="12" fill="#68786f"/>
  <text x="712" y="216" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">mu</text>
  <text x="712" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">2024 level</text>

  <rect x="768" y="190" width="104" height="64" rx="12" fill="#fff" stroke="#68786f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="820" y="212" font-size="14" font-weight="700" fill="#4a564f" text-anchor="middle">+ δ_season</text>
  <text x="820" y="228" font-size="10" fill="#4a564f" text-anchor="middle">training only</text>
  <text x="820" y="242" font-size="10" fill="#4a564f" text-anchor="middle">δ_2024 = 0</text>

  <rect x="880" y="190" width="100" height="64" rx="12" fill="#1c5d4a"/>
  <text x="930" y="216" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">+ a·x_i</text>
  <text x="930" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">server</text>

  <rect x="988" y="190" width="100" height="64" rx="12" fill="#2a6490"/>
  <text x="1038" y="216" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">− b·x_j</text>
  <text x="1038" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">returner</text>

  <rect x="1096" y="190" width="88" height="64" rx="12" fill="#b0512a"/>
  <text x="1140" y="216" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">+ x_iᵀWx_j</text>
  <text x="1140" y="236" font-size="11" fill="#e8ecea" text-anchor="middle">pairing</text>

  <line x1="920" y1="282" x2="920" y2="300" stroke="#4a564f" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="820" y="304" width="200" height="48" rx="12" fill="#3f7a3c"/>
  <text x="920" y="333" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">z → p = 1/(1+e^−z)</text>
  <line x1="664" y1="270" x2="1180" y2="270" stroke="#e1e5e3" stroke-width="1"/>
  <text x="664" y="370" font-size="12" fill="#5b6661">Old seasons absorb their own level in δ, so mu is no longer dragged back in time</text>

  <!-- ===== Panel: Run 1 saved ===== -->
  <rect x="640" y="404" width="560" height="200" rx="18" fill="#fff" stroke="#e1e5e3" filter="url(#sh)"/>
  <text x="664" y="438" font-size="17" font-weight="700" fill="#1f2a26">Run 1 · saved and used for prediction</text>
  <text x="664" y="460" font-size="13" fill="#5b6661">δ is deleted on save. Same 81 numbers per surface as Run 0.</text>

  <rect x="664" y="484" width="110" height="56" rx="12" fill="#68786f"/>
  <text x="719" y="508" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">mu</text>
  <text x="719" y="526" font-size="11" fill="#e8ecea" text-anchor="middle">2024 level</text>
  <rect x="786" y="484" width="110" height="56" rx="12" fill="#1c5d4a"/>
  <text x="841" y="516" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">+ a·x_i</text>
  <rect x="908" y="484" width="110" height="56" rx="12" fill="#2a6490"/>
  <text x="963" y="516" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">− b·x_j</text>
  <rect x="1030" y="484" width="150" height="56" rx="12" fill="#b0512a"/>
  <text x="1105" y="516" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">+ x_iᵀ W x_j</text>

  <!-- stamp -->
  <g transform="translate(1010 560) rotate(-6)">
    <rect x="-150" y="-18" width="300" height="36" rx="8" fill="none" stroke="#3f7a3c" stroke-width="3"/>
    <text x="0" y="7" font-size="15" font-weight="800" fill="#3f7a3c" text-anchor="middle" letter-spacing="1">PREDICTION FORMULA UNCHANGED</text>
  </g>

  <!-- ===== Panel: where mu lands (hard courts) ===== -->
  <rect x="40" y="404" width="560" height="200" rx="18" fill="#fff" stroke="#e1e5e3" filter="url(#sh)"/>
  <text x="64" y="438" font-size="17" font-weight="700" fill="#1f2a26">Where mu lands · hard courts</text>
  <text x="64" y="460" font-size="13" fill="#5b6661">tour service points won, per hundred (the level each mu stands for)</text>

  <!-- axis 61 .. 67 mapped to x 90 .. 570 (80 px per point) -->
  <line x1="90" y1="540" x2="570" y2="540" stroke="#c9cfcc" stroke-width="2"/>
  <g font-size="11" fill="#7a857f" text-anchor="middle">
    <text x="90" y="560">61</text><text x="170" y="560">62</text><text x="250" y="560">63</text>
    <text x="330" y="560">64</text><text x="410" y="560">65</text><text x="490" y="560">66</text><text x="570" y="560">67</text>
  </g>
  <!-- pooled 63.3 -> x = 90 + 2.3*80 = 274 ; 2024 64.4 -> 362 ; 2025 64.7 -> 386 ; 2026 65.9 -> 482 -->
  <circle cx="274" cy="540" r="9" fill="#68786f"/>
  <text x="274" y="512" font-size="12" font-weight="700" fill="#68786f" text-anchor="middle">Run 0 mu</text>
  <text x="274" y="497" font-size="11" fill="#68786f" text-anchor="middle">63.3</text>
  <circle cx="362" cy="540" r="9" fill="#1c5d4a"/>
  <text x="362" y="512" font-size="12" font-weight="700" fill="#1c5d4a" text-anchor="middle">Run 1 mu</text>
  <text x="362" y="497" font-size="11" fill="#1c5d4a" text-anchor="middle">64.4 (2024)</text>
  <line x1="286" y1="540" x2="350" y2="540" stroke="#1c5d4a" stroke-width="3" marker-end="url(#arr)"/>
  <circle cx="386" cy="540" r="6" fill="none" stroke="#3f7a3c" stroke-width="2"/>
  <text x="386" y="584" font-size="11" fill="#3f7a3c" text-anchor="middle">2025 actual 64.7</text>
  <circle cx="482" cy="540" r="6" fill="none" stroke="#8a3a2a" stroke-width="2"/>
  <text x="482" y="584" font-size="11" fill="#8a3a2a" text-anchor="middle">2026 actual 65.9</text>

  <!-- footer -->
  <rect x="40" y="628" width="1160" height="96" rx="18" fill="#eef1ef" stroke="#e1e5e3"/>
  <text x="64" y="660" font-size="14" font-weight="700" fill="#1f2a26">Why the cards cannot fix this on their own</text>
  <text x="64" y="684" font-size="13" fill="#3d4743">Form cards are standardised season by season, so x = 0 always means "average for its era". They carry no information about how good serving is in that era.</text>
  <text x="64" y="706" font-size="13" fill="#3d4743">That level lives only in mu. Anchoring mu on 2024, the last training season, closes the gap; the 2026 rise came after the cutoff and stays as drift.</text>
</svg>
